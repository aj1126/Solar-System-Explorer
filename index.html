<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System D3 Canvas</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background-color: #0d0d0d; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; pointer-events: none; }
        h1 { margin: 0 0 5px 0; font-size: 1.2rem; color: #4DA6FF; }
        p { margin: 0; font-size: 0.85rem; color: #ccc; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="controls">
    <h1>Solar System Explorer</h1>
    <p>Renderer: HTML5 Canvas (Fast)</p>
    <p>Scroll to Zoom | Drag to Pan</p>
    <p id="hover-info">Hover over an orbit...</p>
</div>

<canvas id="chart"></canvas>

<script>
    // 1. Setup Canvas
    const canvas = d3.select("#chart");
    const context = canvas.node().getContext("2d");
    const width = window.innerWidth;
    const height = window.innerHeight;

    canvas.attr("width", width).attr("height", height);

    // Global Zoom State
    let transform = d3.zoomIdentity;

    // 2. Setup Scales (AU to Pixels)
    const scaleX = d3.scaleLinear().domain([-6, 6]).range([0, width]);
    // Store scale factor to calculate pixels per AU
    const pixelsPerAU = width / 12; // width / (6 - -6)

    // 3. Helper: Generate Orbit Points
    function getOrbitPoints(a, e, steps = 150) {
        const points = [];
        for (let i = 0; i <= steps; i++) {
            const theta = (i / steps) * 2 * Math.PI;
            const r = (a * (1 - e * e)) / (1 + e * Math.cos(theta));
            const x = r * Math.cos(theta);
            const y = r * Math.sin(theta);
            points.push([x, y]);
        }
        return points;
    }

    // 4. Main Render Function
    function render(data) {
        // Clear Screen
        context.clearRect(0, 0, width, height);
        
        context.save();
        // Apply Zoom/Pan Transforms
        context.translate(transform.x, transform.y);
        context.scale(transform.k, transform.k);
        
        // Define center offset (Sun position) based on our linear scale logic
        // scaleX(0) gives the pixel x-coordinate of 0 AU (the Sun)
        const sunX = scaleX(0);
        const sunY = height / 2; // vertical center since we didn't use a Y scale here for simplicity

        // Draw Sun
        context.beginPath();
        context.arc(sunX, sunY, 5 / transform.k, 0, 2 * Math.PI);
        context.fillStyle = "#FFD700";
        context.fill();

        // Draw Orbits & Planets
        data.forEach(d => {
            // Draw Orbit Path
            context.beginPath();
            d.orbitPoints.forEach((p, i) => {
                // Manually map AU (p[0], p[1]) to Pixels relative to Sun
                const px = sunX + (p[0] * pixelsPerAU);
                const py = sunY - (p[1] * pixelsPerAU); // Flip Y for screen coords
                if (i === 0) context.moveTo(px, py);
                else context.lineTo(px, py);
            });
            context.closePath();
            // Constant stroke width regardless of zoom
            context.lineWidth = 1 / transform.k; 
            context.strokeStyle = d.color || "#444";
            context.stroke();

            // Draw Planet Marker (at arbitrary point or perihelion)
            // Using the first point of the orbit for simplicity
            const startP = d.orbitPoints[0];
            const planetX = sunX + (startP[0] * pixelsPerAU);
            const planetY = sunY - (startP[1] * pixelsPerAU);

            context.beginPath();
            // Scale radius down so it doesn't get huge when zooming
            context.arc(planetX, planetY, 3 / transform.k, 0, 2 * Math.PI);
            context.fillStyle = d.color || "#444";
            context.fill();
        });

        context.restore();
    }

    // 5. Load Data & Initialize
    d3.json("solar_system_data.json").then(rawData => {
        // Filter & Sort
        const data = rawData
            .filter(d => d.a > 0 && d.e < 0.99)
            .sort((a, b) => b.a - a.a);

        // Pre-calculate orbit points (Performance Optimization)
        // We do this ONCE, not every frame.
        data.forEach(d => {
            d.orbitPoints = getOrbitPoints(d.a, d.e);
        });

        // Initial Draw
        render(data);

        // Setup Zoom Behavior
        const zoom = d3.zoom()
            .scaleExtent([0.1, 2000])
            .on("zoom", (event) => {
                transform = event.transform;
                requestAnimationFrame(() => render(data));
            });

        canvas.call(zoom);

        // Optional: Canvas Mouse Interaction (Tooltips)
        // Calculating "closest object" on canvas is harder than SVG.
        // For performance, we often skip tooltips or use a Quadtree.
        // Simple hit detection:
        d3.select("canvas").on("mousemove", (event) => {
            const [mouseX, mouseY] = d3.pointer(event);
            // Invert transform to get world coordinates
            const worldX = (mouseX - transform.x) / transform.k;
            const worldY = (mouseY - transform.y) / transform.k;
            
            // Find object closest to mouse (Naive search, fast enough for 2k items)
            let closest = null;
            let minDist = Infinity;
            
            data.forEach(d => {
                const startP = d.orbitPoints[0];
                const px = scaleX(0) + (startP[0] * pixelsPerAU);
                const py = (height / 2) - (startP[1] * pixelsPerAU);
                
                const dist = Math.hypot(px - worldX, py - worldY);
                if (dist < (10 / transform.k) && dist < minDist) { // 10px hit radius
                    minDist = dist;
                    closest = d;
                }
            });

            const info = d3.select("#hover-info");
            if (closest) {
                info.html(`<strong>${closest.name}</strong><br>SMA: ${closest.a.toFixed(2)} AU`);
            } else {
                info.text("Hover over a planet...");
            }
        });

    });
</script>
</body>
</html>
